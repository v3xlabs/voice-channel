[package]
name = "vcd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "voice.channel daemon: guild manifests and the conference service, as an XMPP component"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
tokio-xmpp = { version = "6", default-features = false, features = ["component"] }
xmpp-parsers = "0.23"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tokio-tungstenite = "0.30.0"
sdp = "0.17.2"
